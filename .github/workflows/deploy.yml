name: Deploy portfolio to GitHub Pages

# Só publica se passar em todas as barreiras. Se falhar, o site continua na última versão boa.
# Atenção: a falha do deploy NÃO desfaz um commit público. A proteção contra envio de documentos
# acontece antes (hook de pre-commit local e revisão do pull request).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Privacidade (repositório e histórico)
        run: npm run check:privacy && npm run check:history
      - name: Vulnerabilidades em dependências
        run: npm run audit
      - name: Testes de consistência
        run: npm test
      - name: Typecheck e build
        run: npm run build
      - name: Privacidade (site gerado)
        run: npm run check:privacy
      - name: Testes de navegador (PDF ATS, interface, acessibilidade)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
